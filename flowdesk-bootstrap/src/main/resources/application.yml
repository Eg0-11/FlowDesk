spring:
  application:
    name: flowdesk

  # 默认数据源：内存 H2，运行在 PostgreSQL 兼容模式下。
  #
  # H2 仅用于本地开发与自动化测试，不是生产数据库；生产使用 postgres profile
  # （见 application-postgres.yml）。默认环境不需要任何数据库密码即可启动。
  # 刻意不开启 H2 Console。
  datasource:
    url: jdbc:h2:mem:flowdesk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # 迁移默认启用：启动时把 db/migration 下的脚本应用到当前数据源。
  flyway:
    enabled: true

  servlet:
    # multipart 上限：容器侧的第一道栅栏。
    #
    # 它**不是**知识文档上传的真正限制依据 —— Content-Length 可被伪造，且并非所有入口都经过
    # Servlet 容器。应用层会按实际读取到的字节数再限一次（flowdesk.knowledge.upload.max-size）。
    # 这里保持一致，让「明显过大」的请求尽早被拒；max-request-size 略大，给 multipart 边界留余量。
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
      file-size-threshold: 0

  # 默认不装配任何模型适配器：没有 API Key 也能启动与测试，且不存在出网可能。
  #
  # OpenAI starter 在类路径上时，除 chat 之外还会自动装配 embedding / image /
  # audio(speech, transcription) / moderation，它们同样要求 API Key，
  # 因此这里必须一并关闭，否则默认 profile 会启动失败。
  #
  # FD-0010 起 DashScope starter 也在类路径上：它的自动配置全部使用
  # matchIfMissing=true 的 @ConditionalOnProperty，因此「什么都不配」是关不掉的 ——
  # 默认环境必须显式把 dashscope 总开关与各能力都写成 false/none，
  # 否则会创建出要求 API Key 的 DashScope Bean，默认 profile 直接启动失败。
  ai:
    dashscope:
      # 总开关：默认关闭 DashScope 的全部能力（chat / embedding / image / audio / video / rerank / agent）
      enabled: false
      agent: false
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      video: none
      rerank: none
      audio:
        speech: none
        transcription: none

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowdesk:
  ai:
    enabled: false

  mcp:
    client:
      # MCP 客户端（FD-0016）：默认<b>关闭</b>。
      #
      # 关闭时：不创建 SDK 客户端、不初始化、不发送任何网络请求 —— 主服务在既没有两个 MCP 服务、
      # 也没有任何 API Key 的环境里照常启动。两个查询端口（资产查询、监控快照查询）仍然存在，
      # 但明确回答 DISABLED，因此调用方不会把「功能没开」误读成「数据不存在」。
      # 开启时（--flowdesk.mcp.client.enabled=true）：启动期只校验配置，第一次查询才连接。
      enabled: false
      asset:
        # 只允许 http + 完整字面量回环地址（127.0.0.0/8 的四段写法，或 IPv6 回环 ::1），
        # 必须显式带端口，且不能带 userinfo、query、fragment 或路径（MCP 路径固定 /mcp）。
        # 主机名（含 localhost）、0.0.0.0、非回环地址与 https 都会让启动失败。
        base-url: http://127.0.0.1:8091
      monitoring:
        base-url: http://127.0.0.1:8092
      # 初始化、单次调用与建连共用的上界；必须是正数且不超过 30 秒。
      request-timeout: 5s

  knowledge:
    upload:
      # 应用层自己的上传上限：按实际读取到的字节数判断，不依赖 Content-Length 或容器配置。
      max-size: 20MB
    storage:
      # 本地文件系统内容存储的根目录（默认适配器；将来可替换为对象存储）。
      # 内容写入 <root>/documents，临时文件在 <root>/tmp —— 同根保证原子移动在同一文件系统内。
      root: data/knowledge
    chunking:
      # 确定性切片参数（FD-0009）。这些值是「行为的一部分」，改动它们就会改变切片结果，
      # 因此必须显式写在这里，而不是散落在代码里的魔法数字。
      chunk-size: 1000
      # 相邻切片的重叠字符数（targetSize 的 15%）。必须满足 0 <= overlap < chunk-size。
      overlap: 150
      # 单文档切片数量上限：超过即判定文档不适合当前阶段，整个解析失败（不会写入部分切片）。
      max-chunks: 5000
      # 提取文本的 code point 上限：解析过程中一旦超过就立即中断读取，防止 ZIP 炸弹式的超大文本。
      max-extracted-code-points: 1000000
    embedding:
      # 文档切片向量化（FD-0010）：默认<b>关闭</b>。
      #
      # 关闭意味着：不创建 EmbeddingModel、不发生任何网络请求、也不需要任何 API Key；
      # 索引接口返回 503 KNOWLEDGE_EMBEDDING_DISABLED，且不会读取或修改任何文档。
      # 真实链路需要 --spring.profiles.active=postgres,dashscope-embedding，
      # 并且数据源必须是 PostgreSQL（pgvector 只存在于 PostgreSQL）。
      enabled: false
      # provider 与 model 会随向量一起持久化：后续检索阶段据此判断向量由哪个模型生成。
      provider: dashscope
      model: text-embedding-v4
      # 维度与 vector(1024) 列、领域不变量三者必须一致。
      dimensions: 1024
      # 单批切片数：上游 Embedding 接口对一次请求的输入条数有上限。
      batch-size: 10
    retrieval:
      # 知识检索（RAG 4/6）：query 上限、返回条数上限与相似度阈值。
      #
      # 这些值都是「输入契约的一部分」：query 超过上限、topK 或 minScore 越界一律 400，
      # 而不是被静默截断或夹取。topK 与 minScore 可以在请求里覆盖，上限与 query 上限不可以。
      # 约束（FD-0011-R1）：配置只能**收紧**公开契约，不能扩大 ——
      #   1 <= max-query-code-points <= 2000
      #   1 <= default-top-k <= max-top-k <= 20
      #   default-min-score 必须是 0..1 的有限数值
      # 违反任一条都会让应用启动失败。
      max-query-code-points: 2000
      default-top-k: 5
      max-top-k: 20
      default-min-score: 0.30
    rerank:
      # 文本重排（RAG 6/6）：对向量检索的候选做二次排序，默认**关闭**。
      #
      # 关闭时：不要求任何 Key/Endpoint、不发起任何请求，检索与问答行为与之前完全一致
      # （响应的 rankingMode 为 VECTOR_SIMILARITY，且不输出 rerankModel / rerankScore）。
      #
      # 开启需要三件东西，缺一即启动失败：
      #   1. model 必须逐字为 qwen3-rerank（本版本只实现它的扁平请求/响应协议）；
      #   2. endpoint 没有默认值 —— 它包含账号自己的业务空间 ID，必须由部署方显式提供；
      #   3. DashScope API Key 可用（或直接配 spring.ai.dashscope.rerank.api-key）。
      # 另外：重排建立在向量检索之上，因此开启重排时 flowdesk.knowledge.embedding.enabled 必须为 true。
      #
      # 语义边界：只重排本次 topK 候选，不扩大初召回池，因此不可能找回向量检索未召回的切片；
      # 重排失败**不会**静默退回向量排序（那是另一条 502 或 500）。
      #
      # 传输要求（FD-0013-R1/R2）：Endpoint 必须是 https —— Bearer Key 会随请求头发送，
      # 明文 HTTP 只允许本机回环字面量：localhost、完整的 127.x.x.x 四段十进制字面量、IPv6 的 ::1
      # （供自动化测试的本地合成端点使用）；127.example.com 这类「前缀像回环」的写法按远程处理。
      enabled: false
      model: qwen3-rerank
      # 示例（请替换 <workspace-id> 与地域；仓库中不保存任何真实业务空间 ID）：
      #   https://<workspace-id>.ap-southeast-1.maas.aliyuncs.com/compatible-api/v1/reranks
      endpoint: ""
      connect-timeout: 3s
      read-timeout: 10s
