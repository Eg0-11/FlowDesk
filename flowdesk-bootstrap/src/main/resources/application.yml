spring:
  application:
    name: flowdesk

  # 默认数据源：内存 H2，运行在 PostgreSQL 兼容模式下。
  #
  # H2 仅用于本地开发与自动化测试，不是生产数据库；生产使用 postgres profile
  # （见 application-postgres.yml）。默认环境不需要任何数据库密码即可启动。
  # 刻意不开启 H2 Console。
  datasource:
    url: jdbc:h2:mem:flowdesk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # 迁移默认启用：启动时把 db/migration 下的脚本应用到当前数据源。
  flyway:
    enabled: true

  servlet:
    # multipart 上限：容器侧的第一道栅栏。
    #
    # 它**不是**知识文档上传的真正限制依据 —— Content-Length 可被伪造，且并非所有入口都经过
    # Servlet 容器。应用层会按实际读取到的字节数再限一次（flowdesk.knowledge.upload.max-size）。
    # 这里保持一致，让「明显过大」的请求尽早被拒；max-request-size 略大，给 multipart 边界留余量。
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
      file-size-threshold: 0

  # 默认不装配任何模型适配器：没有 API Key 也能启动与测试，且不存在出网可能。
  #
  # OpenAI starter 在类路径上时，除 chat 之外还会自动装配 embedding / image /
  # audio(speech, transcription) / moderation，它们同样要求 API Key，
  # 因此这里必须一并关闭，否则默认 profile 会启动失败。
  #
  # FD-0010 起 DashScope starter 也在类路径上：它的自动配置全部使用
  # matchIfMissing=true 的 @ConditionalOnProperty，因此「什么都不配」是关不掉的 ——
  # 默认环境必须显式把 dashscope 总开关与各能力都写成 false/none，
  # 否则会创建出要求 API Key 的 DashScope Bean，默认 profile 直接启动失败。
  ai:
    dashscope:
      # 总开关：默认关闭 DashScope 的全部能力（chat / embedding / image / audio / video / rerank / agent）
      enabled: false
      agent: false
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      video: none
      rerank: none
      audio:
        speech: none
        transcription: none

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

flowdesk:
  ai:
    enabled: false

  knowledge:
    upload:
      # 应用层自己的上传上限：按实际读取到的字节数判断，不依赖 Content-Length 或容器配置。
      max-size: 20MB
    storage:
      # 本地文件系统内容存储的根目录（默认适配器；将来可替换为对象存储）。
      # 内容写入 <root>/documents，临时文件在 <root>/tmp —— 同根保证原子移动在同一文件系统内。
      root: data/knowledge
    chunking:
      # 确定性切片参数（FD-0009）。这些值是「行为的一部分」，改动它们就会改变切片结果，
      # 因此必须显式写在这里，而不是散落在代码里的魔法数字。
      chunk-size: 1000
      # 相邻切片的重叠字符数（targetSize 的 15%）。必须满足 0 <= overlap < chunk-size。
      overlap: 150
      # 单文档切片数量上限：超过即判定文档不适合当前阶段，整个解析失败（不会写入部分切片）。
      max-chunks: 5000
      # 提取文本的 code point 上限：解析过程中一旦超过就立即中断读取，防止 ZIP 炸弹式的超大文本。
      max-extracted-code-points: 1000000
    embedding:
      # 文档切片向量化（FD-0010）：默认<b>关闭</b>。
      #
      # 关闭意味着：不创建 EmbeddingModel、不发生任何网络请求、也不需要任何 API Key；
      # 索引接口返回 503 KNOWLEDGE_EMBEDDING_DISABLED，且不会读取或修改任何文档。
      # 真实链路需要 --spring.profiles.active=postgres,dashscope-embedding，
      # 并且数据源必须是 PostgreSQL（pgvector 只存在于 PostgreSQL）。
      enabled: false
      # provider 与 model 会随向量一起持久化：后续检索阶段据此判断向量由哪个模型生成。
      provider: dashscope
      model: text-embedding-v4
      # 维度与 vector(1024) 列、领域不变量三者必须一致。
      dimensions: 1024
      # 单批切片数：上游 Embedding 接口对一次请求的输入条数有上限。
      batch-size: 10
