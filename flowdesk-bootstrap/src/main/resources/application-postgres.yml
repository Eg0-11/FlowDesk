# PostgreSQL profile：连接真实 PostgreSQL 数据库。
#
# 使用方式：--spring.profiles.active=postgres，并通过环境变量注入连接信息。
# 仓库中不保存任何真实用户名、密码或连接串。
#
#   $env:FLOWDESK_DB_URL = 'jdbc:postgresql://localhost:5432/flowdesk'
#   $env:FLOWDESK_DB_USERNAME = '<user>'
#   $env:FLOWDESK_DB_PASSWORD = '<password>'
#   java -jar flowdesk-bootstrap/target/flowdesk-bootstrap-0.1.0-SNAPSHOT.jar --spring.profiles.active=postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${FLOWDESK_DB_URL}
    username: ${FLOWDESK_DB_USERNAME}
    password: ${FLOWDESK_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # PostgreSQL 额外加载专用迁移目录：V6 需要 pgvector 扩展与 vector(1024) 列类型，
    # H2 既没有这些类型也没有 CREATE EXTENSION，因此它<b>不</b>放在 db/migration 里。
    # 两个目录的版本号连续（V1~V5 在 db/migration，V6 在 db/postgresql-migration），
    # 因此不会出现「同一版本两个脚本」的歧义。
    locations: classpath:db/migration,classpath:db/postgresql-migration
